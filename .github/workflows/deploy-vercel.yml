name: CI/CD Pipeline - Deploy Crawler & RAG App to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'crawler-rag-app/**'
      - '.github/workflows/deploy-vercel.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crawler-rag-app/**'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI JOB: Lint, Type Check & Build Test
  # ==========================================
  build-and-test:
    name: 🧪 CI: Test & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crawler-rag-app

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./crawler-rag-app/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Test Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VILAO_BASE_URL: ${{ secrets.VILAO_BASE_URL || 'https://api.vilao.ai/v1' }}
          VILAO_EMBEDDING_MODEL: ${{ secrets.VILAO_EMBEDDING_MODEL || 'dg/text-embedding-3-large' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VILAO_API_KEY: ${{ secrets.VILAO_API_KEY || secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ==========================================
  # 2. CD JOB: Automated Vercel Deployment
  # ==========================================
  deploy-to-vercel:
    name: 🚀 CD: Deploy to Vercel Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crawler-rag-app

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./crawler-rag-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VILAO_BASE_URL: ${{ secrets.VILAO_BASE_URL || 'https://api.vilao.ai/v1' }}
          VILAO_EMBEDDING_MODEL: ${{ secrets.VILAO_EMBEDDING_MODEL || 'dg/text-embedding-3-large' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VILAO_API_KEY: ${{ secrets.VILAO_API_KEY || secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
