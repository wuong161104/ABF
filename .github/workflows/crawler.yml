name: ABF Universal Deep Web Crawler Cloud Runner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL website mục tiêu cần cào (VD: https://www.vpbank.com.vn/ca-nhan/dich-vu-the)'
        required: true
        default: 'https://www.vpbank.com.vn/ca-nhan/dich-vu-the'
        type: string
      max_pages:
        description: 'Số lượng trang tối đa (0 = cào toàn bộ 100%)'
        required: true
        default: '50'
        type: string
      save_to_supabase:
        description: 'Lưu Realtime vào Supabase DB'
        required: true
        default: true
        type: boolean

jobs:
  crawl:
    name: 🌐 Deep Crawl Website on Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Tối đa 6 tiếng cào liên tục

    steps:
      - name: 📥 Checkout Mã nguồn Repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests python-dotenv python-docx pypdf psycopg2-binary

      - name: 🌐 Cài đặt trình duyệt Playwright Chromium & dependencies
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Khởi động Universal Deep Crawler (Lưu Realtime vào Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://azpvcqpnecljsosamnot.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          POOLER_HOST: ${{ secrets.POOLER_HOST || 'aws-0-ap-northeast-2.pooler.supabase.com' }}
          POOLER_USER: ${{ secrets.POOLER_USER || 'postgres.azpvcqpnecljsosamnot' }}
          POOLER_PORT: ${{ secrets.POOLER_PORT || '6543' }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || 'thanhvuong16@' }}
          DBNAME: ${{ secrets.DBNAME || 'postgres' }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd abf_project
          SUPABASE_FLAG=""
          if [ "${{ github.event.inputs.save_to_supabase }}" = "false" ]; then
            SUPABASE_FLAG="--no-supabase"
          fi
          python deep_web_crawler.py --url "${{ github.event.inputs.target_url }}" --max-subpages "${{ github.event.inputs.max_pages }}" --headless $SUPABASE_FLAG

      - name: 💾 Nén & Đóng gói Dữ liệu Cào được (Tải về máy tính)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawled-data-result-${{ github.run_number }}
          path: abf_project/crawled_data/
          retention-days: 30
